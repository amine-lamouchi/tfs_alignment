[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "tfs_twin"
version = "0.1.0"
description = "Digital twin of the MFX transfocator (motor layer + wavefront diagnostics) for developing alignment protocols"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # motor layer: what external/mfx/tfs imports
    "ophyd",
    "pcdsdevices",
    "pcdscalc",
    "periodictable",
    "prettytable",
    # forbidden-combination tables used by find_best_combo(avoid_forbidden=True) and track_focus
    "transfocate @ git+https://github.com/pcdshub/transfocate.git@17ab0593cd8f18626316bc848e11af24eda8bda1",
    # diagnostic layer: lcls_beamline_toolbox is installed from the submodule
    # (pip install -e external/lcls_beamline_toolbox), see README
    "numpy",
    "scipy<1.14",  # lcls_beamline_toolbox still uses interp2d (removed in 1.14)
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "jupyterlab", "ipympl"]

[tool.setuptools]
# tfs_twin: the twin itself. protocols: alignment procedures (student work).
packages = ["tfs_twin", "protocols"]
package-dir = {"tfs_twin" = "src/tfs_twin", "protocols" = "protocols"}

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore:.*interp2d.*:DeprecationWarning"]
